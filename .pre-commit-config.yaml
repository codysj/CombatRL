repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: ["src"]
        additional_dependencies:
          - numpy>=2.2,<3.0
          - pydantic>=2.7,<3.0
          - pyyaml>=6.0,<7.0
