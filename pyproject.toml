[project]
name = "combatrl"
version = "0.1.0"
description = "Deterministic tactical combat simulation research environment."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "CombatRL Contributors" },
]
dependencies = [
  "gymnasium==1.3.0",
  "numpy>=2.2,<3.0",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]
renderer = [
  "pygame-ce>=2.5,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--basetemp=.pytest-tmp",
  "-p",
  "no:cacheprovider",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".pytest-tmp",
  ".pytest-tmp-*",
  ".ruff_cache",
  ".uv-cache",
  ".venv",
  "artifacts",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "SIM",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
packages = ["combatrl"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pygame"
ignore_missing_imports = true
