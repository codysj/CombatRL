algorithm: PPO
policy: MlpPolicy
env_config_path: configs/env/gym_2v2_controlled_ranged.yaml
run_name: ppo_2v2_baseline
seed: 42
total_timesteps: 250000
smoke_total_timesteps: 1024
n_envs: 4
